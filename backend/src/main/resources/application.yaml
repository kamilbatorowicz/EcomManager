spring:
  application:
    name: ecom-manager
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ecom_manager}
    username: ${POSTGRES_USER:ecom_manager}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

allegro:
  client-id: ${ALLEGRO_CLIENT_ID:}
  client-secret: ${ALLEGRO_CLIENT_SECRET:}
  user-agent: ${ALLEGRO_USER_AGENT:}
  token-encryption-key: ${ALLEGRO_TOKEN_ENCRYPTION_KEY:}
  redirect-uri: http://localhost:8080/api/integrations/allegro/callback
  frontend-uri: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
